name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential fakeroot devscripts qtbase5-dev
        git clone https://github.com/google/googletest.git third-party/gtest

    - name: Configure CMake
      run: |
        export CMAKE_PREFIX_PATH="/usr/lib/x86_64-linux-gnu/cmake/Qt5:$CMAKE_PREFIX_PATH"
        cmake -B ${{github.workspace}}/build -S ${{github.workspace}} -DCMAKE_BUILD_TYPE=Release

    - name: Build project
      run: cmake --build ${{github.workspace}}/build --config Release

    - name: Run tests
      working-directory: ${{github.workspace}}/build
      run: ctest

    - name: Create Debian package (using CPack)
      run: |
        cd ${{github.workspace}}/build
        cpack -V

    - name: Find generated package
      id: find_package
      run: |
        PACKAGE_NAME=$(find ${{github.workspace}}/build -name "*.deb" | head -n 1)
        echo "Found package: $PACKAGE_NAME"
        echo "package_path=$PACKAGE_NAME" >> $GITHUB_OUTPUT

    - name: Upload Debian package artifact
      uses: actions/upload-artifact@v4
      with:
        name: debian-package
        path: ${{steps.find_package.outputs.package_path}}
